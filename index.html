<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanjay Pal — Coming Soon</title>
<meta name="description" content="Sanjay Pal — UX/UI Designer based in Delhi NCR, India. Portfolio coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d1916;}
  body{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;}
  body.wiping{cursor:grabbing;}

  /* What the mirror reflects (seen sharply through the cleared strokes) */
  #scene{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(ellipse 7% 4% at 60% 0%, #fffdf2 0%, rgba(255,246,220,0) 100%),
      radial-gradient(ellipse 55% 32% at 58% 0%, rgba(255,228,186,.55), transparent 70%),
      linear-gradient(180deg,#8d837a 0%,#655b54 38%,#3e3632 72%,#27221f 100%);}
  #scene .figure{position:absolute;left:50%;top:52%;width:44vmin;height:70vmin;transform:translateX(-50%);
    border-radius:45% 45% 20% 20%;background:radial-gradient(ellipse at 50% 30%,#5a4a43,#2a211e 70%);
    filter:blur(28px);opacity:.75;}
  #scene .glint{position:absolute;left:46%;top:49%;width:9vmin;height:3vmin;border-radius:50%;
    background:#d9b3a8;filter:blur(10px);opacity:.45;}
  #scene .edge{position:absolute;right:0;top:0;bottom:0;width:3.5vmin;
    background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55));}

  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;}

  #links a{position:fixed;display:block;border-radius:12px;z-index:5;pointer-events:none;}
  #links a.on{pointer-events:auto;cursor:pointer;}
  #links a:focus-visible{outline:2px dashed rgba(255,255,255,.7);outline-offset:4px;}

  .ui{position:fixed;z-index:6;font-family:"Gloria Hallelujah","Comic Sans MS",cursive;
    color:rgba(255,255,255,.62);font-size:14px;letter-spacing:.02em;opacity:0;transition:opacity 1.2s ease;
    text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .ui.show{opacity:1;}
  #hint{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;pointer-events:none;}
  #again{right:16px;top:max(14px,env(safe-area-inset-top));background:none;border:0;padding:6px 8px;cursor:pointer;pointer-events:none;}
  #again.show{pointer-events:auto;}
  #again:hover{color:rgba(255,255,255,.9);}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>
<body>
  <div id="scene" aria-hidden="true"><div class="figure"></div><div class="glint"></div><div class="edge"></div></div>
  <canvas id="fog" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="links"></div>
  <p id="hint" class="ui" aria-hidden="true">psst… wipe the mirror</p>
  <button id="again" class="ui" type="button">↺ fog it up again</button>

  <main class="sr">
    <p>Coming soon</p>
    <h1>Sanjay Pal</h1>
    <p>UX/UI Designer</p>
    <p>Location: Delhi NCR, India</p>
    <p>Email: <a href="mailto:sanji.sanjaypal@gmail.com">sanji.sanjaypal@gmail.com</a></p>
    <p>Phone: <a href="tel:+919810503282">9810503282</a></p>
  </main>

<script>
(() => {
  const FONT = '"Gloria Hallelujah", "Comic Sans MS", cursive';
  const LINES = [
    { t: 'coming soon...', s: .34, gap: .45, speed: .30 },
    { t: 'SANJAY PAL', s: 1, gap: .18, speed: .55, drip: .6 },
    { t: 'UX/UI Designer', s: .46, gap: .5, speed: .36, drip: .3 },
    { t: 'Location - Delhi NCR, India', s: .3, gap: .22, speed: .2, drip: .15, info: 1 },
    { t: 'Email - sanji.sanjaypal@gmail.com', s: .3, gap: .22, speed: .2, drip: .15, info: 1, href: 'mailto:sanji.sanjaypal@gmail.com' },
    { t: 'Phone - 9810503282', s: .3, gap: .35, speed: .2, drip: .15, info: 1, href: 'tel:+919810503282' },
  ];

  const fog = document.getElementById('fog'), fx = document.getElementById('fx');
  const fctx = fog.getContext('2d'), xctx = fx.getContext('2d');
  const mask = document.createElement('canvas'), mctx = mask.getContext('2d');
  const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
  const linksEl = document.getElementById('links');
  const hint = document.getElementById('hint'), again = document.getElementById('again');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, DPR, queue = [], qi = 0, pause = 0, drips = [], finger = null, done = false, anchors = [];
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------- fog ---------- */
  const noise = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d'), d = g.createImageData(180, 180);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = 120 + Math.random() * 135;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = Math.random() * 60;
    }
    g.putImageData(d, 0, 0); return c;
  })();

  function paintFog() {
    fctx.globalCompositeOperation = 'source-over';
    fctx.clearRect(0, 0, W, H);
    const g = fctx.createRadialGradient(W * .6, -H * .05, 0, W * .6, -H * .05, Math.max(W, H) * 1.15);
    g.addColorStop(0, 'rgba(247,242,234,.97)');
    g.addColorStop(.35, 'rgba(216,209,202,.94)');
    g.addColorStop(1, 'rgba(150,143,137,.93)');
    fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);

    // old wipe arcs / streaks
    for (let i = 0; i < 80; i++) {
      fctx.beginPath();
      const r = rnd(.2, 1.1) * Math.max(W, H), a = rnd(0, Math.PI * 2);
      fctx.arc(rnd(-.2, 1.2) * W, rnd(-.2, 1.2) * H, r, a, a + rnd(.15, .6));
      fctx.lineWidth = rnd(8, 70);
      fctx.strokeStyle = Math.random() < .55 ? `rgba(255,255,255,${rnd(.015, .05)})` : `rgba(60,50,45,${rnd(.015, .045)})`;
      fctx.stroke();
    }
    fctx.globalAlpha = .35; fctx.fillStyle = fctx.createPattern(noise, 'repeat'); fctx.fillRect(0, 0, W, H); fctx.globalAlpha = 1;

    // condensation beads
    const n = Math.floor(W * H / 700);
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W, y = Math.random() * H, r = rnd(.4, 1.9);
      fctx.globalCompositeOperation = 'destination-out';
      fctx.fillStyle = 'rgba(0,0,0,.28)'; fctx.beginPath(); fctx.arc(x, y, r, 0, 7); fctx.fill();
      fctx.globalCompositeOperation = 'source-over';
      fctx.fillStyle = 'rgba(255,255,255,.35)'; fctx.beginPath(); fctx.arc(x - r * .3, y - r * .3, r * .4, 0, 7); fctx.fill();
    }
  }

  /* ---------- text mask + layout ---------- */
  function heartPath(ctx, cx, cy, size) {
    const s = size / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * .9);
    ctx.bezierCurveTo(cx - s * 1.35, cy + s * .05, cx - s * 1.0, cy - s * 1.0, cx, cy - s * .35);
    ctx.bezierCurveTo(cx + s * 1.0, cy - s * 1.0, cx + s * 1.35, cy + s * .05, cx, cy + s * .9);
    ctx.stroke();
  }

  function build() {
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    mctx.clearRect(0, 0, W, H);
    mctx.font = `100px ${FONT}`;
    const unit = LINES.map(l => mctx.measureText(l.t).width / 100);
    const maxW = W * .86;
    const base = Math.min(W * .17, H * .15);
    let sizes = LINES.map((l, i) => Math.min(base * l.s, maxW / unit[i]));
    const infoMin = Math.min(...LINES.map((l, i) => l.info ? sizes[i] : 1e9));
    sizes = sizes.map((s, i) => LINES[i].info ? infoMin : s);
    let heart = sizes[1] * .55;
    const lh = s => s * 1.3;
    let total = sizes.reduce((a, s, i) => a + lh(s) + s * LINES[i].gap, 0) + heart * 1.2;
    const k = Math.min(1, (H * .9) / total);
    sizes = sizes.map(s => s * k); heart *= k; total *= k;

    queue = []; anchors.forEach(a => a.remove()); anchors = [];
    let y = (H - total) / 2;
    mctx.fillStyle = mctx.strokeStyle = '#000';
    mctx.lineJoin = mctx.lineCap = 'round';
    mctx.textBaseline = 'middle'; mctx.textAlign = 'left';

    LINES.forEach((l, li) => {
      const s = sizes[li];
      mctx.font = `${s}px ${FONT}`;
      const w = mctx.measureText(l.t).width, x = (W - w) / 2, mid = y + lh(s) / 2;
      const lw = Math.max(1.5, s * .075);
      mctx.lineWidth = lw;
      mctx.fillText(l.t, x, mid); mctx.strokeText(l.t, x, mid);

      for (let i = 0; i < l.t.length; i++) {
        const ch = l.t[i];
        if (ch === ' ') { queue.push({ pause: .1 }); continue; }
        const x0 = x + mctx.measureText(l.t.slice(0, i)).width;
        const x1 = x + mctx.measureText(l.t.slice(0, i + 1)).width;
        const cw = x1 - x0;
        queue.push({
          x0, x1, mid, s, amp: s * .5, p: 0,
          dur: Math.max(.06, l.speed * (cw / s) + .04),
          freq: rnd(1.6, 2.6), ph: rnd(0, 6.28),
          r: Math.max(cw * .32, s * .17, 2.5),
          box: [x0 - lw, mid - s * .72, cw + lw * 2, s * 1.44],
          drip: l.drip || 0,
        });
      }
      if (l.href) {
        const a = document.createElement('a');
        a.href = l.href; a.setAttribute('aria-label', l.t);
        Object.assign(a.style, { left: x + 'px', top: (mid - s * .7) + 'px', width: w + 'px', height: s * 1.4 + 'px' });
        linksEl.appendChild(a); anchors.push(a);
        queue.push({ link: a });
      }
      queue.push({ pause: li === 1 ? .7 : .45 });
      y += lh(s) + s * l.gap;
    });

    // heart
    const cx = W / 2, cy = y + heart * .55;
    mctx.lineWidth = Math.max(2, heart * .13);
    heartPath(mctx, cx, cy, heart);
    queue.push({
      x0: cx - heart * .65, x1: cx + heart * .65, mid: cy, s: heart, amp: heart * .5, p: 0,
      dur: .9, freq: 3, ph: 0, r: heart * .22,
      box: [cx - heart * .8, cy - heart * .65, heart * 1.6, heart * 1.4], drip: 1,
    });
  }

  /* ---------- erasing helpers ---------- */
  function clampBox([x, y, w, h]) {
    x = Math.max(0, Math.floor(x)); y = Math.max(0, Math.floor(y));
    w = Math.min(W - x, Math.ceil(w)); h = Math.min(H - y, Math.ceil(h));
    return [x, y, w, h];
  }
  function eraseMask(box) {
    const [x, y, w, h] = clampBox(box); if (w <= 0 || h <= 0) return;
    fctx.globalCompositeOperation = 'destination-out';
    fctx.drawImage(mask, x * DPR, y * DPR, w * DPR, h * DPR, x, y, w, h);
    fctx.globalCompositeOperation = 'source-over';
  }
  function brush(c, t0, t1) {
    const pad = c.r;
    const [x, y, w, h] = clampBox([c.box[0] - pad, c.box[1] - pad, c.box[2] + pad * 2, c.box[3] + pad * 2]);
    if (w <= 0 || h <= 0) return;
    const X = x * DPR, Y = y * DPR, Wd = w * DPR, Hd = h * DPR;
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = 'source-over';
    tctx.clearRect(X, Y, Wd, Hd);
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.fillStyle = '#000';
    const n = Math.ceil((t1 - t0) * 80) + 1;
    let pt;
    for (let i = 0; i <= n; i++) {
      pt = point(c, t0 + (t1 - t0) * i / n);
      tctx.beginPath(); tctx.arc(pt[0], pt[1], c.r, 0, 7); tctx.fill();
    }
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = 'source-in';
    tctx.drawImage(mask, X, Y, Wd, Hd, X, Y, Wd, Hd);
    tctx.globalCompositeOperation = 'source-over';
    fctx.globalCompositeOperation = 'destination-out';
    fctx.drawImage(tmp, X, Y, Wd, Hd, x, y, w, h);
    fctx.globalCompositeOperation = 'source-over';
    finger = { x: pt[0], y: pt[1], s: c.s };
  }
  const point = (c, t) => [c.x0 + (c.x1 - c.x0) * t, c.mid + c.amp * Math.sin(t * Math.PI * 2 * c.freq + c.ph)];

  /* ---------- drips ---------- */
  function spawnDrip(c) {
    if (drips.length > 45) return;
    const x = rnd(c.x0 + 2, c.x1 - 2), y = c.mid + c.s * rnd(.15, .4);
    drips.push({
      x, y, w: Math.min(5, Math.max(1.4, c.s * .035)),
      end: Math.random() < .55 ? H + 20 : y + rnd(.12, .5) * H,
      v: rnd(25, 70), stall: rnd(.2, .9),
    });
  }
  function updateDrips(dt) {
    fctx.globalCompositeOperation = 'destination-out';
    fctx.lineCap = 'round'; fctx.strokeStyle = '#000';
    for (const d of drips) {
      if (d.stall > 0) { d.stall -= dt; continue; }
      const py = d.y;
      d.v = Math.max(12, Math.min(110, d.v + rnd(-60, 60) * dt));
      d.y += d.v * dt;
      if (Math.random() < dt * .35) d.stall = rnd(.2, 1.2);
      fctx.lineWidth = d.w;
      fctx.beginPath(); fctx.moveTo(d.x, py); fctx.lineTo(d.x, d.y); fctx.stroke();
    }
    fctx.globalCompositeOperation = 'source-over';
    drips = drips.filter(d => d.y < d.end);
  }
  function drawFx() {
    xctx.clearRect(0, 0, W, H);
    for (const d of drips) {
      const r = d.w * 1.15;
      xctx.fillStyle = 'rgba(255,255,255,.22)';
      xctx.beginPath(); xctx.ellipse(d.x, d.y, r, r * 1.35, 0, 0, 7); xctx.fill();
      xctx.fillStyle = 'rgba(255,255,255,.75)';
      xctx.beginPath(); xctx.arc(d.x - r * .35, d.y - r * .35, r * .35, 0, 7); xctx.fill();
    }
    if (finger && !done) {
      // a faint fingertip pressing from the other side of the glass
      const r = Math.max(14, finger.s * .38);
      const g = xctx.createRadialGradient(finger.x, finger.y, 0, finger.x, finger.y, r);
      g.addColorStop(0, 'rgba(255,214,196,.28)'); g.addColorStop(1, 'rgba(255,214,196,0)');
      xctx.fillStyle = g; xctx.beginPath(); xctx.arc(finger.x, finger.y, r, 0, 7); xctx.fill();
    }
  }

  /* ---------- writing sequence ---------- */
  function step(dt) {
    let budget = dt;
    while (budget > 0 && qi < queue.length) {
      const it = queue[qi];
      if (it.pause !== undefined) {
        pause += budget;
        if (pause >= it.pause) { budget = pause - it.pause; pause = 0; qi++; finger = null; } else budget = 0;
      } else if (it.link) { it.link.classList.add('on'); qi++; }
      else {
        const t0 = it.p, need = (1 - t0) * it.dur, use = Math.min(budget, need);
        it.p = t0 + use / it.dur; budget -= use;
        brush(it, t0, it.p);
        if (it.p >= 1) {
          eraseMask(it.box);
          if (Math.random() < it.drip) spawnDrip(it);
          qi++;
        }
      }
    }
    if (qi >= queue.length && !done) finish();
  }
  function finish() {
    done = true; finger = null;
    anchors.forEach(a => a.classList.add('on'));
    hint.classList.add('show'); again.classList.add('show');
  }
  function revealAll() {
    fctx.globalCompositeOperation = 'destination-out';
    fctx.drawImage(mask, 0, 0, W, H);
    fctx.globalCompositeOperation = 'source-over';
    qi = queue.length; finish();
  }

  /* ---------- setup / loop ---------- */
  function setup(keepDone) {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [fog, fx, mask, tmp]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    xctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintFog(); build();
    drips = []; qi = 0; pause = 0; finger = null;
    const wasDone = done; done = false;
    hint.classList.remove('show'); again.classList.remove('show');
    if (reduce || (keepDone && wasDone)) revealAll();
    else queue.unshift({ pause: .9 });
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!done) step(dt);
    updateDrips(dt);
    drawFx();
    requestAnimationFrame(loop);
  }

  /* ---------- wipe with finger / mouse ---------- */
  let wiping = false, lp = null;
  addEventListener('pointerdown', e => {
    if (e.target.closest('a,button')) return;
    wiping = true; lp = [e.clientX, e.clientY]; document.body.classList.add('wiping'); wipe(e);
  });
  addEventListener('pointermove', e => { if (wiping) wipe(e); });
  addEventListener('pointerup', () => { wiping = false; lp = null; document.body.classList.remove('wiping'); });
  addEventListener('pointercancel', () => { wiping = false; lp = null; });
  function wipe(e) {
    const p = [e.clientX, e.clientY];
    fctx.globalCompositeOperation = 'destination-out';
    fctx.lineCap = 'round'; fctx.lineWidth = Math.max(26, Math.min(W, H) * .055);
    fctx.beginPath(); fctx.moveTo(lp[0], lp[1]); fctx.lineTo(p[0], p[1]); fctx.stroke();
    fctx.globalCompositeOperation = 'source-over';
    if (Math.random() < .04) spawnDrip({ x0: p[0] - 10, x1: p[0] + 10, mid: p[1], s: 40 });
    lp = p;
    hint.classList.remove('show');
  }

  again.addEventListener('click', () => setup(false));
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => setup(true), 200); });

  const start = () => { setup(false); requestAnimationFrame(t => { last = t; loop(t); }); };
  Promise.race([
    document.fonts ? document.fonts.load(`80px ${FONT}`) : Promise.resolve(),
    new Promise(r => setTimeout(r, 2500)),
  ]).then(start, start);
})();
</script>
</body>
</html>
