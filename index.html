<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanjay Pal — UX/UI Designer</title>
<meta name="description" content="Sanjay Pal — UX/UI Designer based in Delhi NCR, India. Portfolio coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151210; --ink-soft:#3b332c; --sand:#e4d3bf; --line:#151210;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--sand);color:var(--ink);font-family:Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  .hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;align-items:center}
  .hero picture, .hero img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}

  .copy{position:relative;z-index:1;padding:0 0 0 clamp(24px,6.2vw,120px);width:min(48vw,720px)}
  .eyebrow{font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(15px,1.9vw,30px);margin:0 0 .55em}
  .row{display:flex;align-items:center;gap:clamp(18px,2vw,34px)}
  h1{margin:0;font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;font-size:clamp(60px,8.6vw,160px)}
  h1 small{display:block;font-size:.42em;font-weight:800;letter-spacing:.34em;line-height:1.2;margin-top:.12em}
  .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:clamp(22px,2.6vw,44px)}
  .cta{display:inline-block;border:1.5px solid var(--line);padding:.62em 1.4em;text-decoration:none;text-transform:uppercase;letter-spacing:.06em;font-weight:500;font-size:clamp(14px,1.45vw,22px);transition:background .25s,color .25s}
  .cta:hover,.cta:focus-visible{background:var(--ink);color:#efe5d8;outline:none}
  .cta.solid{background:var(--ink);color:#efe5d8}
  .cta.solid:hover,.cta.solid:focus-visible{background:transparent;color:var(--ink)}

  .meta{position:absolute;z-index:1;left:clamp(24px,6.2vw,120px);bottom:clamp(20px,3.2vw,48px);display:flex;flex-wrap:wrap;gap:.4em 2.2em;font-size:clamp(12px,.95vw,15px);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .meta span{white-space:nowrap}
  .meta a{text-decoration:none;border-bottom:1px solid transparent;text-transform:none;letter-spacing:.03em}
  .meta a:hover{border-bottom-color:currentColor}
  .meta em{font-style:normal;opacity:.6;margin-right:.6em}

  /* phones & narrow tablets: photo on top, copy below on the same studio sand */
  @media (max-width:820px){
    .hero{flex-direction:column;align-items:stretch;min-height:0}
    .hero img.photo{position:relative;height:62svh;min-height:380px;object-position:80% 50%}
    .hero::after{content:"";position:absolute;left:0;right:0;top:calc(62svh - 90px);height:92px;background:linear-gradient(rgba(228,211,191,0),var(--sand));pointer-events:none}
    .copy{width:auto;padding:4px 16px 0;margin-top:-6px;z-index:2}
    .row{gap:14px}
    h1{font-size:clamp(56px,19vw,96px)}
    .actions{gap:10px}
    .cta{padding:.62em 1.1em}
    .meta{position:relative;left:auto;bottom:auto;padding:28px 16px 32px;flex-direction:column;gap:.55em}
  }
  @media (max-width:820px) and (max-height:560px){ .hero img.photo{height:85svh} }
</style>
</head>
